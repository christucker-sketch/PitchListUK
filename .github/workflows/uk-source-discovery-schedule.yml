name: UK source discovery schedule

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/uk-source-discovery-schedule.yml'
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      query_offset:
        description: Optional query offset (0-95). Blank uses the rotating daily offset.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: findpitches-global-acquisition-shadow-proof
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: findpitches-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: operations/cloudflare-global-acquisition/wrangler.jsonc
      WORKFLOW_NAME: findpitches-global-acquisition-shadow
      EPHEMERAL_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out verified main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run discovery safety tests
        run: node --test tests/uk-cloudflare-source-discovery.test.mjs tests/internal-serper-service-binding.test.mjs tests/global-cloudflare-acquisition-controller.test.mjs

      - name: Compile US and global Workers
        run: |
          npx --yes wrangler@4.127.1 deploy --dry-run --config operations/cloudflare-texas-acquisition/wrangler.jsonc
          npx --yes wrangler@4.127.1 deploy --dry-run --config "$CONFIG"

      - name: Deploy current US internal-service wrapper
        run: npx --yes wrangler@4.127.1 deploy --config operations/cloudflare-texas-acquisition/wrangler.jsonc

      - name: Provision temporary GitHub branch-write token
        run: printf '%s' "$EPHEMERAL_GITHUB_TOKEN" | npx --yes wrangler@4.127.1 secret put GITHUB_TOKEN --config "$CONFIG"

      - name: Deploy PR-only global acquisition Worker
        run: >-
          npx --yes wrangler@4.127.1 deploy --config "$CONFIG"
          --var GLOBAL_ACQUISITION_EXECUTION_ENABLED:true
          --var GLOBAL_ACQUISITION_EXECUTION_LEVEL:pr_only
          --var GITHUB_REPO:christucker-sketch/PitchListUK

      - name: Prove US production acquisition remains blocked
        shell: bash
        run: |
          set -euo pipefail
          instance_id="uk-discovery-scheduled-blocked-us-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          params='{"country":"US","state_code":"NY","mode":"acquire"}'
          npx --yes wrangler@4.127.1 workflows trigger "$WORKFLOW_NAME" "$params" --id "$instance_id" --config "$CONFIG"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances/${instance_id}?simple=true"
          for attempt in $(seq 1 60); do
            body="$(curl --silent --show-error --fail-with-body "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
            status="$(jq -r '.result.status // empty' <<<"$body")"
            if [[ "$status" == 'errored' ]]; then
              message="$(jq -r '.result.error.message // empty' <<<"$body")"
              [[ "$message" == *'Global acquisition controller is PR-only'* ]] || { echo "Unexpected safety error: $message" >&2; exit 1; }
              exit 0
            fi
            [[ "$status" != 'complete' && "$status" != 'terminated' ]] || { echo "US mutation probe unexpectedly reached $status" >&2; exit 1; }
            sleep 2
          done
          echo 'PR-only US mutation proof timed out.' >&2
          exit 1

      - name: Resolve rotating discovery offset
        id: offset
        shell: bash
        env:
          REQUESTED_OFFSET: ${{ inputs.query_offset }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED_OFFSET:-}" ]]; then
            [[ "$REQUESTED_OFFSET" =~ ^[0-9]+$ ]] || { echo 'query_offset must be numeric' >&2; exit 1; }
            offset=$(( REQUESTED_OFFSET % 96 ))
          else
            day="$(date -u +%j)"
            offset=$(( (10#$day * 4) % 96 ))
          fi
          offset=$(( (offset / 4) * 4 ))
          echo "value=$offset" >> "$GITHUB_OUTPUT"
          echo "Using UK discovery query offset $offset (4-query batch, maximum 4 Serper credits)." >> "$GITHUB_STEP_SUMMARY"

      - name: Run bounded rotating UK source discovery
        shell: bash
        env:
          QUERY_OFFSET: ${{ steps.offset.outputs.value }}
        run: |
          set -euo pipefail
          instance_id="uk-source-discovery-scheduled-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          as_of="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          params="$(jq -cn --arg as_of "$as_of" --argjson offset "$QUERY_OFFSET" '{country:"UK",mode:"uk_source_discovery_pr",as_of:$as_of,query_offset:$offset,query_limit:4,results_per_query:5,candidate_limit:20,concurrency:2,timeout_ms:12000}')"
          npx --yes wrangler@4.127.1 workflows trigger "$WORKFLOW_NAME" "$params" --id "$instance_id" --config "$CONFIG"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances/${instance_id}"
          for attempt in $(seq 1 300); do
            body="$(curl --silent --show-error --fail-with-body "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
            status="$(jq -r '.result.status // empty' <<<"$body")"
            if [[ "$status" == 'complete' ]]; then
              printf '%s\n' "$body" > uk-source-discovery-scheduled-result.json
              jq -e '.result.output.country == "UK" and .result.output.mode == "uk_source_discovery_pr" and .result.output.source_removals == 0 and .result.output.opportunity_pr_attempted == false and .result.output.production_opportunity_write_attempted == false and .result.output.direct_production_deployment_attempted == false and .result.output.automatic_merge_attempted == false' <<<"$body" >/dev/null
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              jq '.result.output' <<<"$body" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$status" == 'errored' || "$status" == 'terminated' ]]; then printf '%s\n' "$body" > uk-source-discovery-scheduled-result.json; jq '.result.error' <<<"$body" >&2; exit 1; fi
            sleep 5
          done
          echo 'UK source discovery timed out.' >&2
          exit 1

      - name: Restore read-only global acquisition Worker
        if: always()
        run: npx --yes wrangler@4.127.1 deploy --config "$CONFIG"

      - name: Remove temporary GitHub token
        if: always()
        run: printf '%s' '{"GITHUB_TOKEN":null}' | npx --yes wrangler@4.127.1 secret bulk --config "$CONFIG"

      - name: Upload scheduled discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uk-source-discovery-scheduled-${{ github.run_id }}-${{ github.run_attempt }}
          path: uk-source-discovery-scheduled-result.json
          if-no-files-found: ignore
          retention-days: 14
