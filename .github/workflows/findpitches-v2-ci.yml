name: FindPitches v2 CI

on:
  push:
    branches:
      - 'findpitches-v2/**'
    paths:
      - 'platform/findpitches-v2/**'
      - 'operations/findpitches-v2/**'
      - 'tests/findpitches-v2/**'
      - '.github/workflows/findpitches-v2-ci.yml'
      - '.github/workflows/findpitches-v2-shadow-deploy.yml'
  pull_request:
    paths:
      - 'platform/findpitches-v2/**'
      - 'operations/findpitches-v2/**'
      - 'tests/findpitches-v2/**'
      - '.github/workflows/findpitches-v2-ci.yml'
      - '.github/workflows/findpitches-v2-shadow-deploy.yml'

permissions:
  contents: read

concurrency:
  group: findpitches-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run FindPitches v2 tests
        run: node --test tests/findpitches-v2/*.test.mjs

      - name: Validate fresh D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/findpitches-v2.db
          for migration in operations/findpitches-v2/migrations/*.sql; do
            sqlite3 /tmp/findpitches-v2.db < "$migration"
          done
          sqlite3 /tmp/findpitches-v2.db ".tables"

      - name: Compile isolated FindPitches v2 Worker
        run: npx --yes wrangler@4.127.1 deploy --dry-run --config operations/findpitches-v2/wrangler.jsonc

      - name: Reject accidental production dataset changes
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only origin/main...HEAD)"
          if grep -Eq '^(functions/_data/|public/index\.html$)' <<<"$changed"; then
            echo "FindPitches v2 must not modify production datasets or homepage during shadow development." >&2
            exit 1
          fi
