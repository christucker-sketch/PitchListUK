name: FindPitches v2 Status Proof

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: findpitches-v2-status-proof
  cancel-in-progress: true

jobs:
  prove:
    name: prove
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out current catalogue
        uses: actions/checkout@v4

      - name: Prove FindPitches v2 cloud health
        shell: bash
        run: |
          set -euo pipefail

          expected_jobs="$(node --input-type=module -e "import { roundRobinSchedule } from './platform/findpitches-v2/scheduler/catalogue.mjs'; process.stdout.write(String(roundRobinSchedule().length))")"
          expected_catalogue="$(node --input-type=module -e "import { GEOGRAPHY_CATALOG_VERSION } from './platform/findpitches-v2/geography/catalog.mjs'; process.stdout.write(GEOGRAPHY_CATALOG_VERSION)")"
          health="$(curl --silent --show-error --fail-with-body https://api.findpitches.com/health)"
          status="$(curl --silent --show-error --fail-with-body https://api.findpitches.com/status)"

          jq -e '
            .ok == true and
            .service == "findpitches-v2-shadow" and
            .mode == "shadow" and
            .database == "isolated" and
            .publication_enabled == false and
            .legacy_runtime_dependency == false and
            .local_runtime_dependency == false
          ' <<<"$health" >/dev/null

          jq -e '
            .ok == true and
            .service == "findpitches-v2-shadow" and
            .mode == "shadow" and
            .publication_enabled == false and
            .counts.scheduler_jobs >= 3
          ' <<<"$status" >/dev/null

          catalogue="$(jq -r '.catalogue.value // empty' <<<"$status")"
          jobs="$(jq -r '.counts.scheduler_jobs // 0' <<<"$status")"
          search_configured="$(jq -r '.search_configured // false' <<<"$status")"

          if [[ -n "$catalogue" ]]; then
            if [[ "$catalogue" != "$expected_catalogue" ]]; then
              echo "::error title=FindPitches v2 catalogue mismatch::Expected geography catalogue $expected_catalogue, got $catalogue"
              exit 1
            fi

            if [[ "$jobs" -ne "$expected_jobs" ]]; then
              echo "::error title=FindPitches v2 scheduler mismatch::Current enabled geography catalogue should contain $expected_jobs jobs, got $jobs"
              exit 1
            fi
          fi

          if [[ "$search_configured" != "true" ]]; then
            echo "::warning title=FindPitches v2 search paused::Dedicated FINDPITCHES_SEARCH_API_KEY is not configured; cloud runtime is healthy but discovery is paused."
          fi

          {
            echo "## FindPitches v2 cloud status"
            echo
            echo "- Service: $(jq -r '.service' <<<"$status")"
            echo "- Mode: $(jq -r '.mode' <<<"$status")"
            echo "- Search configured: $search_configured"
            echo "- Publication enabled: $(jq -r '.publication_enabled' <<<"$status")"
            echo "- Scheduler jobs: $jobs"
            echo "- Acquisition runs: $(jq -r '.counts.runs' <<<"$status")"
            echo "- Candidates: $(jq -r '.counts.candidates' <<<"$status")"
            echo "- Publication queue: $(jq -r '.counts.publication_queue' <<<"$status")"
            if [[ -n "$catalogue" ]]; then
              echo "- Catalogue version: $catalogue"
            else
              echo "- Catalogue version: not reconciled yet"
            fi
            echo
            echo "### Market scheduler"
            echo '~~~json'
            jq '.markets' <<<"$status"
            echo '~~~'
            echo
            echo "### Latest run"
            echo '~~~json'
            jq '.latest_run' <<<"$status"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
