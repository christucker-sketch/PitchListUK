name: FindPitches v2 promotion backlog audit

"on":
  push:
    branches:
      - findpitches-v2/venue-evidence-recovery
    paths:
      - .github/workflows/findpitches-v2-promotion-backlog-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: findpitches-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove isolated fail-closed v2 before read
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl --silent --show-error --fail-with-body --max-time 15 https://api.findpitches.com/health)"
          jq -e '.ok == true and .database == "isolated" and
            .mode == "shadow" and .publication_enabled == false' <<< "$body" >/dev/null
      - name: Read aggregate promotion backlog
        run: node operations/findpitches-v2/audit-promotion-backlog.mjs
