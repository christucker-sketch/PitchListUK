name: Canada opportunity frontend deployment

on:
  push:
    branches: [main]
    paths:
      - 'functions/_data/ca-opportunities.mjs'
      - '.github/workflows/ca-opportunity-frontend-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pitchlistuk-frontend-production
  cancel-in-progress: false

jobs:
  deploy_frontend_production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: findpitches-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out exact main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate site and functions before Canada deployment
        run: node scripts/check.js

      - name: Run regression tests before Canada deployment
        run: node --test tests/*.test.mjs

      - name: Run opportunity pipeline tests before Canada deployment
        run: npm run test:pipeline

      - name: Build deterministic production output
        run: npm run build

      - name: Assert required production output exists
        run: |
          test -f functions/_data/ca-opportunities.mjs
          test -f public/global/index.html
          test -f public/global/home.css
          test -f public/us/index.html
          test -f public/us/find-pitches.html
          test -f public/uk/index.html
          test -f public/shared/findpitches-shell.css

      - name: Deploy exact verified main to existing Pages project
        run: npx --yes wrangler@4.127.1 pages deploy public --project-name pitchlistuk --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false

      - name: Verify live routes while Canada customer surface stays dark
        shell: bash
        run: |
          set -euo pipefail

          verify_live() {
            url="$1"
            marker="$2"
            label="$3"
            last_status='not-requested'
            for attempt in $(seq 1 60); do
              body="$(mktemp)"
              last_status="$(curl --silent --show-error --location --connect-timeout 10 --max-time 20 --output "$body" --write-out '%{http_code}' "$url" || true)"
              if [[ "$last_status" == '200' ]] && grep -Fq "$marker" "$body"; then
                rm -f "$body"
                echo "Verified $label on attempt $attempt"
                return 0
              fi
              rm -f "$body"
              if [[ "$attempt" -lt 60 ]]; then sleep 3; fi
            done
            echo "::error title=Production verification failed::$label remained unavailable or stale after 60 attempts (last HTTP status: $last_status)"
            return 1
          }

          verify_dark() {
            url="$1"
            label="$2"
            body="$(mktemp)"
            status="$(curl --silent --show-error --connect-timeout 10 --max-time 20 --output "$body" --write-out '%{http_code}' "$url" || true)"
            rm -f "$body"
            [[ "$status" == '404' ]] || {
              echo "::error title=Canada dark-launch verification failed::$label returned HTTP $status instead of 404"
              return 1
            }
            echo "Verified $label remains dark"
          }

          verify_live 'https://findpitches.com/' 'Start with where you trade.' 'global root'
          verify_live 'https://findpitches.com/us/' 'data-country="us"' 'US country site'
          verify_live 'https://findpitches.com/uk/' 'data-country="uk"' 'UK country site'
          verify_live 'https://findpitches.com/api/us-customer-opportunities/search?limit=1' '"total"' 'US opportunity API'
          verify_dark 'https://findpitches.com/ca/' 'Canada customer site'
          verify_dark 'https://findpitches.com/api/ca-customer-opportunities/search?region=AB&limit=1' 'Canada customer opportunity API'
