name: Finalize US safe-main-drift controller patch

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'fix/us-controller-safe-main-drift'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Finalize exact controller patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('operations/cloudflare-texas-acquisition/scripts/rollout-controller.mjs')
          s = p.read_text()

          if 'if (prefix === String(baseSha).slice(0, 16).toLowerCase()) return baseSha;' not in s:
              pattern = re.compile(r"(const prefix = branchBasePrefix\(expectedBranch\);\s*if \(!prefix\) throw new Error\('Auto-merge PR branch lacks original base provenance'\);\s*)(let branchBaseSha;)")
              s, count = pattern.subn(r"\1if (prefix === String(baseSha).slice(0, 16).toLowerCase()) return baseSha;\n  \2", s, count=1)
              if count != 1: raise SystemExit(f'base helper replacement count={count}')

          validation = """  if (pr?.baseRefOid !== baseSha) throw new Error('Auto-merge PR base is not the exact current main SHA');
  const branchBaseSha = resolveAutoMergeBranchBase(expectedBranch, baseSha, snapshotPath);
  if (!expectedBranch.endsWith(`-base-${String(branchBaseSha).slice(0, 16)}`)) {
    throw new Error('Auto-merge PR branch provenance does not match its original base');
  }
"""
          pattern = re.compile(r"\s*if \(pr\?\.baseRefOid !== baseSha\) throw new Error\('Auto-merge PR base is not the exact current main SHA'\);\s*const branchBaseSha = resolveAutoMergeBranchBase\(expectedBranch, baseSha, snapshotPath\);\s*if \(!expectedBranch\.endsWith\(`-base-\$\{String\(branchBaseSha\)\.slice\(0, 16\)\}`\)\) \{\s*throw new Error\('Auto-merge PR branch provenance does not match its original base'\);\s*\}")
          s, count = pattern.subn('\n' + validation.rstrip(), s, count=1)
          if count != 1: raise SystemExit(f'validation replacement count={count}')

          p.write_text(s)
          PY
          rm .github/workflows/finalize-us-controller-safe-main-drift.yml
          git diff --check
          node --test operations/opportunity-pipeline/tests/us-auto-merge-base-drift.test.js operations/opportunity-pipeline/tests/us-rollout-controller.test.js
      - name: Commit final patch and remove workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add operations/cloudflare-texas-acquisition/scripts/rollout-controller.mjs .github/workflows/finalize-us-controller-safe-main-drift.yml
          git commit -m "Finalize snapshot-aware US auto-merge reconciliation"
          git push origin HEAD:${{ github.head_ref }}
