name: FindPitches v2 Structured Feed Shadow Stage

on:
  push:
    branches:
      - findpitches-v2/structured-feed-importer
    paths:
      - operations/findpitches-v2/importer/payloads/structured-feed-stage.sql

permissions:
  contents: read

concurrency:
  group: findpitches-v2-structured-feed-shadow-stage
  cancel-in-progress: false

jobs:
  stage:
    name: stage_structured_feed_shadow_only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: findpitches-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: operations/findpitches-v2/wrangler.jsonc
      MIGRATION: operations/findpitches-v2/migrations/0009_structured_feed_staging.sql
      PAYLOAD: operations/findpitches-v2/importer/payloads/structured-feed-stage.sql
      EXPECTED_SHA256: 836eac33e65d3951acb422d2e4b1579f97b12fa74a12d1498a7dd96285cd501f

    steps:
      - name: Check out importer branch
        uses: actions/checkout@v4

      - name: Verify exact staged SQL payload
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PAYLOAD"
          actual="$(sha256sum "$PAYLOAD" | awk '{print $1}')"
          echo "payload sha256=$actual"
          [[ "$actual" == "$EXPECTED_SHA256" ]]

          first="$(head -n 1 "$PAYLOAD" | tr -d '\r')"
          last="$(tail -n 1 "$PAYLOAD" | tr -d '\r')"
          [[ "$first" == "BEGIN TRANSACTION;" ]]
          [[ "$last" == "COMMIT;" ]]

          if grep -Eiq '(INSERT[[:space:]]+INTO|REPLACE[[:space:]]+INTO|UPDATE|DELETE[[:space:]]+FROM)[[:space:]]+(customer_opportunities|publication_queue|candidates|customer_promotion_disposition)\b' "$PAYLOAD"; then
            echo "Payload attempts to write a forbidden downstream table." >&2
            exit 1
          fi

          grep -Eq 'INSERT[[:space:]]+INTO[[:space:]]+structured_feed_records\b' "$PAYLOAD"
          grep -Eq 'INSERT[[:space:]]+INTO[[:space:]]+structured_feed_imports\b' "$PAYLOAD"

      - name: Run staging writer tests
        run: node operations/findpitches-v2/importer/stage-structured-feed.test.mjs

      - name: Record pre-write downstream counts
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.1 d1 execute FINDPITCHES_DB --remote --yes \
            --command "SELECT (SELECT COUNT(*) FROM customer_opportunities) AS customer_count, (SELECT COUNT(*) FROM publication_queue) AS publication_count;" \
            --config "$CONFIG" | tee pre-counts.txt

          python3 - <<'PY'
          import json, re, pathlib
          t=pathlib.Path('pre-counts.txt').read_text()
          m=re.search(r'\[\s*\{.*\}\s*\]', t, re.S)
          if not m: raise SystemExit('Could not parse pre-write counts')
          obj=json.loads(m.group(0))[0]['results'][0]
          pathlib.Path('pre-customer.txt').write_text(str(obj['customer_count']))
          pathlib.Path('pre-publication.txt').write_text(str(obj['publication_count']))
          print('pre customer=',obj['customer_count'],'publication=',obj['publication_count'])
          PY

      - name: Apply staging-only migration 0009
        shell: bash
        run: |
          set -euo pipefail
          set +e
          out="$(npx --yes wrangler@4.127.1 d1 execute FINDPITCHES_DB --remote --yes --file "$MIGRATION" --config "$CONFIG" 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [[ $rc -ne 0 ]] && ! grep -Eq 'already exists|Not currently importing anything' <<<"$out"; then
            exit "$rc"
          fi

      - name: Stage producer feed into isolated tables
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.1 d1 execute FINDPITCHES_DB --remote --yes \
            --file "$PAYLOAD" --config "$CONFIG"

      - name: Prove staging count and downstream isolation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.1 d1 execute FINDPITCHES_DB --remote --yes \
            --command "SELECT (SELECT COUNT(*) FROM structured_feed_records) AS structured_feed_count, (SELECT COUNT(*) FROM structured_feed_imports) AS structured_import_count, (SELECT COUNT(*) FROM customer_opportunities) AS customer_count, (SELECT COUNT(*) FROM publication_queue) AS publication_count;" \
            --config "$CONFIG" | tee post-counts.txt

          python3 - <<'PY'
          import json, re, pathlib
          t=pathlib.Path('post-counts.txt').read_text()
          m=re.search(r'\[\s*\{.*\}\s*\]', t, re.S)
          if not m: raise SystemExit('Could not parse post-write counts')
          obj=json.loads(m.group(0))[0]['results'][0]
          pre_customer=int(pathlib.Path('pre-customer.txt').read_text())
          pre_publication=int(pathlib.Path('pre-publication.txt').read_text())
          print('post structured=',obj['structured_feed_count'],'imports=',obj['structured_import_count'],'customer=',obj['customer_count'],'publication=',obj['publication_count'])
          if obj['structured_feed_count'] != 1599:
              raise SystemExit(f"Expected 1599 staged rows, got {obj['structured_feed_count']}")
          if obj['customer_count'] != pre_customer:
              raise SystemExit('customer_opportunities count changed')
          if obj['publication_count'] != pre_publication:
              raise SystemExit('publication_queue count changed')
          PY

      - name: Show latest structured-feed import
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.127.1 d1 execute FINDPITCHES_DB --remote --yes \
            --command "SELECT import_id,status,total_records,rejected_records,started_at,completed_at FROM structured_feed_imports ORDER BY started_at DESC LIMIT 3;" \
            --config "$CONFIG"
