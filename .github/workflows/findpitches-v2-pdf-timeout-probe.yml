name: FindPitches v2 PDF timeout probe

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: findpitches-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Prove live v2 remains isolated and publication-off
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --silent --show-error --fail-with-body --max-time 15 https://api.findpitches.com/health)"
          jq -e '.ok == true and .database == "isolated" and .mode == "shadow" and .publication_enabled == false' <<< "$health" >/dev/null
      - name: Probe retryable PDF timeout cohort read-only
        run: node operations/findpitches-v2/probe-pdf-timeout-cohort.mjs
      - name: Upload timeout probe
        uses: actions/upload-artifact@v4
        with:
          name: pdf-timeout-probe-${{ github.run_id }}
          path: pdf-timeout-probe.json
          retention-days: 14
