name: FindPitches v2 PR Shadow Deploy

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - '.github/workflows/findpitches-v2-pr-shadow-deploy.yml'

permissions:
  contents: read

concurrency:
  group: findpitches-v2-pr-shadow-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.number == 1872 && contains(github.event.pull_request.body || '', '[deploy-v2-shadow-once]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: findpitches-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: operations/findpitches-v2/wrangler.jsonc
      ENRICHMENT_CONFIG: operations/findpitches-v2-enrichment/wrangler.jsonc

    steps:
      - name: Check out PR head exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run FindPitches v2 tests
        run: node --test tests/findpitches-v2/*.test.mjs

      - name: Compile isolated shadow Worker
        run: npx --yes wrangler@4.127.1 deploy --dry-run --config "$CONFIG"

      - name: Compile isolated enrichment Worker
        run: npx --yes wrangler@4.127.1 deploy --dry-run --config "$ENRICHMENT_CONFIG"

      - name: Apply isolated D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in operations/findpitches-v2/migrations/*.sql; do
            echo "Applying $migration"
            applied=false
            for attempt in 1 2 3; do
              set +e
              output="$(npx --yes wrangler@4.127.1 d1 execute FINDPITCHES_DB --remote --yes --file "$migration" --config "$CONFIG" 2>&1)"
              rc=$?
              set -e
              printf '%s\n' "$output"
              if [[ $rc -eq 0 ]]; then
                applied=true
                break
              fi
              if grep -Fq "Not currently importing anything." <<<"$output"; then
                echo "Empty/idempotent import; continuing."
                applied=true
                break
              fi
              if [[ "$migration" == "operations/findpitches-v2/migrations/0008_location_evidence_gate.sql" ]] &&
                 grep -Fq "duplicate column name: location_evidence_url: SQLITE_ERROR" <<<"$output"; then
                echo "Known previously-applied 0008 duplicate-column case; continuing."
                applied=true
                break
              fi
              if grep -Fq "code: 7500" <<<"$output"; then
                echo "Transient Cloudflare D1 internal error on attempt $attempt; retrying."
                sleep $((attempt * 3))
                continue
              fi
              exit "$rc"
            done
            if [[ "$applied" != "true" ]]; then
              echo "Migration failed after bounded retries: $migration" >&2
              exit 1
            fi
          done

      - name: Deploy isolated shadow API Worker
        run: npx --yes wrangler@4.127.1 deploy --config "$CONFIG"

      - name: Deploy isolated enrichment Worker
        run: npx --yes wrangler@4.127.1 deploy --config "$ENRICHMENT_CONFIG"

      - name: Prove isolated enrichment runtime
        shell: bash
        run: |
          set -euo pipefail
          passed=false
          for attempt in $(seq 1 15); do
            health="$(curl --silent --show-error --fail-with-body https://findpitches-v2-enrichment.ctucker.workers.dev/health || true)"
            status="$(curl --silent --show-error --fail-with-body https://findpitches-v2-enrichment.ctucker.workers.dev/status || true)"
            if jq -e '.ok == true and .service == "findpitches-v2-enrichment" and .database == "isolated" and .serper_configured == false' <<<"$health" >/dev/null 2>&1 &&
               jq -e '.ok == true and .service == "findpitches-v2-enrichment" and (.queue.ready >= 0) and (.queue.leased >= 0) and (.queue.complete >= 0)' <<<"$status" >/dev/null 2>&1; then
              passed=true
              break
            fi
            sleep 2
          done
          [[ "$passed" == "true" ]] || { printf '%s\n%s\n' "$health" "$status" >&2; exit 1; }

      - name: Prove isolated shadow API and publication-off
        shell: bash
        run: |
          set -euo pipefail
          passed=false
          for attempt in $(seq 1 15); do
            health="$(curl --silent --show-error --fail-with-body https://api.findpitches.com/health || true)"
            status="$(curl --silent --show-error --fail-with-body https://api.findpitches.com/status || true)"
            if jq -e '.ok == true and .service == "findpitches-v2-shadow" and .mode == "shadow" and .database == "isolated" and .publication_enabled == false and .legacy_runtime_dependency == false and .local_runtime_dependency == false' <<<"$health" >/dev/null 2>&1 &&
               jq -e '.ok == true and .publication_enabled == false' <<<"$status" >/dev/null 2>&1; then
              passed=true
              break
            fi
            sleep 2
          done
          [[ "$passed" == "true" ]] || { printf '%s\n%s\n' "$health" "$status" >&2; exit 1; }

      - name: Show final shadow status
        shell: bash
        run: |
          curl --silent --show-error --fail-with-body https://api.findpitches.com/status | jq .
          curl --silent --show-error --fail-with-body https://findpitches-v2-enrichment.ctucker.workers.dev/status | jq .
