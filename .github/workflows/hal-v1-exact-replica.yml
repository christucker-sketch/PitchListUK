name: Hal V1 exact replica verification
# Isolated historical replica; never deploy or publish.

on:
  push:
    branches:
      - test/hal-v1-exact-replica
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-hal-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prove acquisition engine is byte-for-byte Hal baseline
        run: git diff --exit-code 18ee3268e7c81e754f24160c77dd64ac4a7906aa HEAD -- operations/opportunity-pipeline
      - name: Exercise original Hal growth entry point without network or writes
        working-directory: operations/opportunity-pipeline
        run: node scripts/grow-database.js --dry-run --all
      - name: Run original Hal opportunity-pipeline tests
        working-directory: operations/opportunity-pipeline
        run: npm test
      - name: Run historical parity regression tests
        run: node --test tests/hal-v1-parity.test.mjs

      - name: Run exact Hal defaults against current UK snapshot
        working-directory: operations/opportunity-pipeline
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          PITCHLIST_PIPELINE_RUNTIME_DIR: ${{ runner.temp }}/hal-v1-live-runtime
          PITCHLIST_SERPER_RUN_BUDGET: '144'
        run: |
          set -euo pipefail
          mkdir -p "$PITCHLIST_PIPELINE_RUNTIME_DIR/data"
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { ACTIVE_FIELDNAMES } = require('./acquisition/config');
          const { toCsv } = require('./acquisition/csv');
          (async () => {
            const source = new URL('../../functions/_data/opportunities.mjs', 'file://' + process.cwd() + '/');
            const mod = await import(source.href + '?seed=' + Date.now());
            const rows = mod.opportunitySnapshot.rows.map(row => ({
              ...Object.fromEntries(ACTIVE_FIELDNAMES.map(k => [k, ''])),
              ...row,
              publishable: row.publishable === true ? 'true' : String(row.publishable || ''),
              quality_reasons: Array.isArray(row.quality_reasons) ? row.quality_reasons.join(';') : String(row.quality_reasons || ''),
              first_seen: row.first_seen || row.last_checked || '',
              last_seen: row.last_seen || row.last_checked || '',
              lifecycle_status: row.lifecycle_status || 'active'
            }));
            const out = path.join(process.env.PITCHLIST_PIPELINE_RUNTIME_DIR, 'data/events-active.csv');
            fs.writeFileSync(out, toCsv(rows, ACTIVE_FIELDNAMES), { mode: 0o600 });
            console.log(JSON.stringify({seed_rows: rows.length, seed_source: 'functions/_data/opportunities.mjs', output: out}));
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node scripts/grow-database.js --apply --max-lanes 36 --query-limit 4

      - name: Run exact Hal approved-source growth loop in isolated canonical clone
        env:
          HAL_REPLICA_RUNTIME: ${{ runner.temp }}/hal-v1-approved-source-runtime
        run: |
          set -euo pipefail
          origin="${RUNNER_TEMP}/hal-v1-origin.git"
          checkout="${RUNNER_TEMP}/hal-v1-main"
          rm -rf "$origin" "$checkout" "$HAL_REPLICA_RUNTIME"
          git clone --bare . "$origin"
          git --git-dir="$origin" update-ref refs/heads/main "$GITHUB_SHA"
          git clone "$origin" "$checkout"
          cd "$checkout"
          git checkout main
          PITCHLIST_PIPELINE_RUNTIME_DIR="$HAL_REPLICA_RUNTIME" \
          PITCHLIST_AUTOMATIC_ADDITIONS_ENABLED=false \
          node scripts/run-approved-source-growth.js --force | tee "$RUNNER_TEMP/hal-v1-approved-source-growth.json"

      - name: Upload exact Hal approved-source growth evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hal-v1-approved-source-growth-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hal-v1-approved-source-runtime
            ${{ runner.temp }}/hal-v1-approved-source-growth.json
          if-no-files-found: warn
          retention-days: 7

      - name: Summarise isolated Hal runtime
        if: always()
        working-directory: operations/opportunity-pipeline
        env:
          PITCHLIST_PIPELINE_RUNTIME_DIR: ${{ runner.temp }}/hal-v1-live-runtime
        run: |
          echo "### Isolated Hal V1 live acquisition" >> "$GITHUB_STEP_SUMMARY"
          find "$PITCHLIST_PIPELINE_RUNTIME_DIR" -maxdepth 3 -type f -printf '%P\n' | sort >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload isolated Hal runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hal-v1-live-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hal-v1-live-runtime
          if-no-files-found: warn
          retention-days: 7
