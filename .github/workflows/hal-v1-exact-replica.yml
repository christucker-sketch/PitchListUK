name: Hal V1 exact replica verification
# Isolated historical replica; never deploy or publish.

on:
  push:
    branches:
      - test/hal-v1-unapproved-discovery
  workflow_dispatch:
    inputs:
      run_acquisition:
        description: 'Run the paid isolated acquisition sweep'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-hal-v1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prove only the targeted discovery-gate files differ from Hal
        run: |
          set -euo pipefail
          changed="$(git diff --name-only 18ee3268e7c81e754f24160c77dd64ac4a7906aa HEAD -- operations/opportunity-pipeline | sort)"
          expected="$(printf '%s\n' operations/opportunity-pipeline/acquisition/lanes.js operations/opportunity-pipeline/lib/fetch-policy.js operations/opportunity-pipeline/lib/opportunity-safety.js operations/opportunity-pipeline/scripts/acquire-events.js operations/opportunity-pipeline/scripts/clean-staged-events.js operations/opportunity-pipeline/scripts/audit-rejects.js operations/opportunity-pipeline/scripts/discover-event-seeds.js operations/opportunity-pipeline/scripts/generate-hop2-queries.js operations/opportunity-pipeline/tests/discovery-strategy.test.js operations/opportunity-pipeline/tests/fetch-policy.test.js operations/opportunity-pipeline/tests/opportunity-safety.test.js | sort)"
          test "$changed" = "$expected"
      - name: Exercise original Hal growth entry point without network or writes
        working-directory: operations/opportunity-pipeline
        run: node scripts/grow-database.js --dry-run --all
      - name: Run original Hal opportunity-pipeline tests
        working-directory: operations/opportunity-pipeline
        run: npm test
      - name: Run historical parity regression tests
        run: node --test tests/hal-v1-parity.test.mjs

      - name: Run 76-city Hal discovery against current production snapshot
        if: github.event_name == 'workflow_dispatch' && inputs.run_acquisition == true
        working-directory: operations/opportunity-pipeline
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          PITCHLIST_PIPELINE_RUNTIME_DIR: ${{ runner.temp }}/hal-v1-live-runtime
          PITCHLIST_SERPER_RUN_BUDGET: '456'
          PITCHLIST_ALLOW_UNAPPROVED_DISCOVERY: 'true'
          CURRENT_UK_SNAPSHOT: ${{ runner.temp }}/current-opportunities.mjs
        run: |
          set -euo pipefail
          mkdir -p "$PITCHLIST_PIPELINE_RUNTIME_DIR/data"
          git show origin/main:functions/_data/opportunities.mjs > "$CURRENT_UK_SNAPSHOT"
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { pathToFileURL } = require('url');
          const { ACTIVE_FIELDNAMES } = require('./acquisition/config');
          const { toCsv } = require('./acquisition/csv');
          (async () => {
            const source = pathToFileURL(process.env.CURRENT_UK_SNAPSHOT);
            const mod = await import(source.href + '?seed=' + Date.now());
            const rows = mod.opportunitySnapshot.rows.map(row => ({
              ...Object.fromEntries(ACTIVE_FIELDNAMES.map(k => [k, ''])),
              ...row,
              publishable: row.publishable === true ? 'true' : String(row.publishable || ''),
              quality_reasons: Array.isArray(row.quality_reasons) ? row.quality_reasons.join(';') : String(row.quality_reasons || ''),
              first_seen: row.first_seen || row.last_checked || '',
              last_seen: row.last_seen || row.last_checked || '',
              lifecycle_status: row.lifecycle_status || 'active'
            }));
            const out = path.join(process.env.PITCHLIST_PIPELINE_RUNTIME_DIR, 'data/events-active.csv');
            fs.writeFileSync(out, toCsv(rows, ACTIVE_FIELDNAMES), { mode: 0o600 });
            console.log(JSON.stringify({seed_rows: rows.length, seed_source: 'origin/main:functions/_data/opportunities.mjs', output: out}));
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          mapfile -t CITY_LANES < <(node - <<'NODE'
          const { CITY_LANES } = require('./acquisition/lanes');
          for (const lane of CITY_LANES) console.log(lane.id);
          NODE
          )
          args=()
          for lane in "${CITY_LANES[@]}"; do args+=(--lane "$lane"); done
          node scripts/grow-database.js --apply "${args[@]}" --max-lanes 76 --query-limit 6

      - name: Summarise isolated Hal runtime
        if: always()
        working-directory: operations/opportunity-pipeline
        env:
          PITCHLIST_PIPELINE_RUNTIME_DIR: ${{ runner.temp }}/hal-v1-live-runtime
        run: |
          echo "### Isolated Hal V1 live acquisition" >> "$GITHUB_STEP_SUMMARY"
          find "$PITCHLIST_PIPELINE_RUNTIME_DIR" -maxdepth 3 -type f -printf '%P\n' | sort >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload isolated Hal runtime
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hal-v1-live-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hal-v1-live-runtime
          if-no-files-found: warn
          retention-days: 7
