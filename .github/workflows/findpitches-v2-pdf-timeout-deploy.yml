name: FindPitches v2 PDF timeout one-shot deploy

"on":
  push:
    branches:
      - findpitches-v2/venue-evidence-recovery
    paths:
      - .github/workflows/findpitches-v2-pdf-timeout-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: findpitches-v2-shadow-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: findpitches-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: operations/findpitches-v2/wrangler.jsonc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run complete v2 regression suite
        run: node --test tests/findpitches-v2/*.test.mjs
      - name: Compile isolated v2 worker
        run: npx --yes wrangler@4.127.1 deploy --dry-run --config "$CONFIG"
      - name: Prove current runtime is isolated and publication-off
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --silent --show-error --fail-with-body --max-time 15 https://api.findpitches.com/health)"
          status="$(curl --silent --show-error --fail-with-body --max-time 15 https://api.findpitches.com/status)"
          jq -e '.ok == true and .database == "isolated" and .mode == "shadow" and .publication_enabled == false' <<<"$health" >/dev/null
          jq -e '.ok == true and .publication_enabled == false and .counts.scheduler_jobs == 483' <<<"$status" >/dev/null
      - name: Deploy isolated v2 worker only
        run: npx --yes wrangler@4.127.1 deploy --config "$CONFIG"
      - name: Prove PDF timeout policy is live
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 15); do
            health="$(curl --silent --show-error --fail-with-body --max-time 15 https://api.findpitches.com/health || true)"
            status="$(curl --silent --show-error --fail-with-body --max-time 15 https://api.findpitches.com/status || true)"
            if jq -e '.ok == true and .database == "isolated" and .mode == "shadow" and
              .publication_enabled == false and .pdf_fetch_timeout_ms == 25000' <<<"$health" >/dev/null 2>&1 &&
              jq -e '.ok == true and .publication_enabled == false and .counts.scheduler_jobs == 483' <<<"$status" >/dev/null 2>&1; then
              ok=true
              break
            fi
            sleep 3
          done
          [[ "$ok" == "true" ]] || { echo "$health" >&2; echo "$status" >&2; exit 1; }
