name: PitchList verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate site and functions
        run: node scripts/check.js

      - name: Run regression tests
        run: node --test tests/*.test.mjs

      - name: Run opportunity pipeline tests
        run: npm run test:pipeline

      - name: Compile Cloudflare Texas acquisition workflow
        run: npx --yes wrangler@4.127.0 deploy --dry-run --config operations/cloudflare-texas-acquisition/wrangler.jsonc

      - name: Check patch whitespace
        run: git diff --check

      - name: Verify source and generated asset parity
        run: |
          cmp -s src/database.js public/database.js
          cmp -s src/analytics.js public/analytics.js
          cmp -s src/styles.css public/styles.css

  acquisition_worker_changes:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.paths.outputs.deploy }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect acquisition Worker changes
        id: paths
        shell: bash
        run: |
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before='${{ github.event.before }}'
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            before="$(git rev-list --max-parents=0 HEAD)"
          fi
          deploy=false
          while IFS= read -r changed; do
            case "$changed" in
              operations/cloudflare-texas-acquisition/*|operations/opportunity-pipeline/lib/us-*|operations/opportunity-pipeline/config/us-*|operations/opportunity-pipeline/config/texas-*|.github/workflows/verify.yml)
                deploy=true
                break
                ;;
            esac
          done < <(git diff --name-only "$before" "$GITHUB_SHA")
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  deploy_acquisition_worker_production:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.verify.result == 'success' && needs.acquisition_worker_changes.outputs.deploy == 'true'
    needs: [verify, acquisition_worker_changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pitchlist-acquisition-worker-production
      cancel-in-progress: false
    environment: findpitches-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out verified main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy verified acquisition Worker
        run: npx --yes wrangler@4.127.0 deploy --config operations/cloudflare-texas-acquisition/wrangler.jsonc

      - name: Record acquisition Worker deployment
        run: npx --yes wrangler@4.127.0 deployments list --config operations/cloudflare-texas-acquisition/wrangler.jsonc

  frontend_changes:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.paths.outputs.deploy }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect production frontend changes
        id: paths
        shell: bash
        run: |
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before='${{ github.event.before }}'
          if [[ -z "$before" || "$before" =~ ^0+$ ]]; then
            before="$(git rev-list --max-parents=0 HEAD)"
          fi
          deploy=false
          while IFS= read -r changed; do
            case "$changed" in
              src/*|platform/*|functions/_middleware.js|functions/api/*|scripts/build.js|scripts/generate-seo-pages.js|scripts/deploy-public-site.js|package.json|package-lock.json|.github/workflows/verify.yml)
                deploy=true
                break
                ;;
            esac
          done < <(git diff --name-only "$before" "$GITHUB_SHA")
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  deploy_frontend_production:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.verify.result == 'success' && needs.frontend_changes.outputs.deploy == 'true'
    needs: [verify, frontend_changes]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pitchlistuk-frontend-production
      cancel-in-progress: false
    environment: findpitches-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out verified main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build deterministic production output
        run: npm run build

      - name: Assert required country output exists
        run: |
          test -f public/global/index.html
          test -f public/global/home.css
          test -f public/us/index.html
          test -f public/us/find-pitches.html
          test -f public/uk/index.html
          test -f public/shared/findpitches-shell.css

      - name: Deploy verified main to existing Pages project
        run: npx --yes wrangler@4.127.1 pages deploy public --project-name pitchlistuk --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=false

      - name: Verify production country routes and API
        shell: bash
        run: |
          verify_live() {
            url="$1"
            marker="$2"
            label="$3"
            last_status='not-requested'
            for attempt in $(seq 1 60); do
              body="$(mktemp)"
              last_status="$(curl --silent --show-error --location --connect-timeout 10 --max-time 20 --output "$body" --write-out '%{http_code}' "$url" || true)"
              if [[ "$last_status" == '200' ]] && grep -Fq "$marker" "$body"; then
                rm -f "$body"
                echo "Verified $label on attempt $attempt"
                return 0
              fi
              rm -f "$body"
              if [[ "$attempt" -lt 60 ]]; then sleep 3; fi
            done
            echo "::error title=Production verification failed::$label remained unavailable or stale after 60 attempts (last HTTP status: $last_status)"
            return 1
          }
          verify_live 'https://findpitches.com/' 'Start with where you trade.' 'global root'
          verify_live 'https://findpitches.com/us/' 'data-country="us"' 'US country site'
          verify_live 'https://findpitches.com/uk/' 'data-country="uk"' 'UK country site'
          verify_live 'https://findpitches.com/global/home.css' '.global-hero' 'global stylesheet'
          verify_live 'https://findpitches.com/us/home.css' '.us-hero' 'US stylesheet'
          verify_live 'https://findpitches.com/uk/home.css' '.uk-hero' 'UK stylesheet'
          verify_live 'https://findpitches.com/api/us-customer-opportunities/search?limit=1' '"total"' 'US opportunity API'
