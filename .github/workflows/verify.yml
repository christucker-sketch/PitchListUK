name: PitchList verification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate site and functions
        run: node scripts/check.js

      - name: Run regression tests
        run: node --test tests/*.test.mjs

      - name: Run opportunity pipeline tests
        run: npm run test:pipeline

      - name: Compile Cloudflare Texas acquisition workflow
        run: npx --yes wrangler@4.127.0 deploy --dry-run --config operations/cloudflare-texas-acquisition/wrangler.jsonc

      - name: Check patch whitespace
        run: git diff --check

      - name: Verify source and generated asset parity
        run: |
          cmp -s src/database.js public/database.js
          cmp -s src/analytics.js public/analytics.js
          cmp -s src/styles.css public/styles.css
