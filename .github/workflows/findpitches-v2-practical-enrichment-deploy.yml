name: FindPitches v2 practical enrichment one-shot deploy

"on":
  push:
    branches:
      - findpitches-v2/venue-evidence-recovery
    paths:
      - .github/workflows/findpitches-v2-practical-enrichment-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: findpitches-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run full v2 test suite
        run: node --test tests/findpitches-v2/*.test.mjs
      - name: Compile enrichment worker
        run: npx --yes wrangler@4.127.1 deploy --dry-run --config operations/findpitches-v2-enrichment/wrangler.jsonc
      - name: Prove live v2 remains fail-closed before enrichment change
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --silent --show-error --fail-with-body --max-time 15 https://api.findpitches.com/health)"
          jq -e '.ok == true and .service == "findpitches-v2-shadow" and
            .mode == "shadow" and .database == "isolated" and
            .publication_enabled == false' <<< "$health" >/dev/null
      - name: Deploy only isolated v2 enrichment worker
        run: npx --yes wrangler@4.127.1 deploy --config operations/findpitches-v2-enrichment/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Prove practical enrichment ruleset is live
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 12); do
            body="$(curl --silent --show-error --fail-with-body --max-time 15 https://findpitches-v2-enrichment.ctucker.workers.dev/health || true)"
            if jq -e '.ok == true and .service == "findpitches-v2-enrichment" and
              .database == "isolated" and .serper_configured == false and
              .enrichment_ruleset == "2026-09-30-practical-location-v1" and
              .batch_limit == 12 and
              .fresh_enqueue_limit == 8 and .minimum_ruleset_refresh_limit == 4' <<< "$body" >/dev/null 2>&1; then
              ok=true
              break
            fi
            sleep 3
          done
          [[ "$ok" == "true" ]] || { printf '%s\n' "$body" >&2; exit 1; }
