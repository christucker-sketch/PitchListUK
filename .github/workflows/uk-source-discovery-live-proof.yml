name: UK source discovery live proof

on:
  pull_request:
    paths:
      - 'operations/cloudflare-global-acquisition/**'
      - 'operations/cloudflare-texas-acquisition/src/entrypoint.js'
      - 'operations/cloudflare-texas-acquisition/src/internal-serper-broker.js'
      - 'operations/cloudflare-texas-acquisition/wrangler.jsonc'
      - 'tests/uk-cloudflare-source-discovery.test.mjs'
      - 'tests/internal-serper-service-binding.test.mjs'
      - '.github/workflows/uk-source-discovery-live-proof.yml'
  push:
    branches: [main]
    paths:
      - 'operations/cloudflare-global-acquisition/**'
      - 'operations/cloudflare-texas-acquisition/src/entrypoint.js'
      - 'operations/cloudflare-texas-acquisition/src/internal-serper-broker.js'
      - 'operations/cloudflare-texas-acquisition/wrangler.jsonc'
      - 'tests/internal-serper-service-binding.test.mjs'
      - '.github/workflows/uk-source-discovery-live-proof.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: findpitches-uk-source-discovery-live-proof
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run UK discovery and internal-service regression tests
        run: node --test tests/uk-cloudflare-source-discovery.test.mjs tests/internal-serper-service-binding.test.mjs tests/global-cloudflare-acquisition-controller.test.mjs

      - name: Compile US acquisition Worker wrapper
        run: npx --yes wrangler@4.127.1 deploy --dry-run --config operations/cloudflare-texas-acquisition/wrangler.jsonc

      - name: Compile global Cloudflare acquisition Worker
        run: npx --yes wrangler@4.127.1 deploy --dry-run --config operations/cloudflare-global-acquisition/wrangler.jsonc

  live_proof:
    if: github.event_name != 'pull_request'
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: findpitches-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: operations/cloudflare-global-acquisition/wrangler.jsonc
      WORKFLOW_NAME: findpitches-global-acquisition-shadow
      EPHEMERAL_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out verified main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy US acquisition Worker with internal search wrapper
        run: npx --yes wrangler@4.127.1 deploy --config operations/cloudflare-texas-acquisition/wrangler.jsonc

      - name: Provision temporary GitHub write token on global shadow
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$EPHEMERAL_GITHUB_TOKEN" | npx --yes wrangler@4.127.1 secret put GITHUB_TOKEN --config "$CONFIG"

      - name: Deploy PR-only global acquisition shadow with US search binding
        run: >-
          npx --yes wrangler@4.127.1 deploy --config "$CONFIG"
          --var GLOBAL_ACQUISITION_EXECUTION_ENABLED:true
          --var GLOBAL_ACQUISITION_EXECUTION_LEVEL:pr_only
          --var GITHUB_REPO:christucker-sketch/PitchListUK

      - name: Wait for PR-only Worker propagation
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://findpitches-global-acquisition-shadow.ctucker.workers.dev/health'
          observed=false
          for attempt in $(seq 1 45); do
            if body="$(curl --silent --show-error --fail-with-body "$endpoint")"; then
              level="$(jq -r '.execution_level // empty' <<<"$body")"
              enabled="$(jq -r '.execution_enabled // false' <<<"$body")"
              cutover="$(jq -r '.us_controller_cutover_enabled // true' <<<"$body")"
              if [[ "$level" == 'pr_only' && "$enabled" == 'true' && "$cutover" == 'false' ]]; then
                printf '%s\n' "$body" > uk-source-discovery-pr-only-health.json
                observed=true
                break
              fi
            fi
            sleep 2
          done
          [[ "$observed" == 'true' ]] || { echo 'PR-only Worker deployment did not become observable before UK live proof.' >&2; exit 1; }

      - name: Prove PR-only still blocks US production acquisition
        shell: bash
        run: |
          set -euo pipefail
          instance_id="uk-discovery-blocked-us-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          params='{"country":"US","state_code":"NY","mode":"acquire"}'
          npx --yes wrangler@4.127.1 workflows trigger "$WORKFLOW_NAME" "$params" --id "$instance_id" --config "$CONFIG"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances/${instance_id}?simple=true"
          proved=false
          for attempt in $(seq 1 45); do
            body="$(curl --silent --show-error --fail-with-body "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
            status="$(jq -r '.result.status // empty' <<<"$body")"
            if [[ "$status" == 'errored' ]]; then
              message="$(jq -r '.result.error.message // empty' <<<"$body")"
              [[ "$message" == *'Global acquisition controller is PR-only'* ]] || { echo "Unexpected PR-only error: $message" >&2; exit 1; }
              printf '%s\n' "$body" > uk-source-discovery-blocked-us.json
              proved=true
              break
            fi
            [[ "$status" != 'complete' && "$status" != 'terminated' ]] || { echo "US production probe reached unexpected terminal state: $status" >&2; exit 1; }
            sleep 2
          done
          [[ "$proved" == 'true' ]] || { echo 'US production probe did not fail closed.' >&2; exit 1; }

      - name: Run bounded UK source discovery PR proof
        shell: bash
        run: |
          set -euo pipefail
          instance_id="uk-source-discovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          as_of="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          params="$(jq -cn --arg as_of "$as_of" '{country:"UK",mode:"uk_source_discovery_pr",as_of:$as_of,query_offset:0,query_limit:4,results_per_query:5,candidate_limit:20,concurrency:2,timeout_ms:12000}')"
          npx --yes wrangler@4.127.1 workflows trigger "$WORKFLOW_NAME" "$params" --id "$instance_id" --config "$CONFIG"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances/${instance_id}"
          completed=false
          for attempt in $(seq 1 300); do
            body="$(curl --silent --show-error --fail-with-body "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
            status="$(jq -r '.result.status // empty' <<<"$body")"
            if [[ "$status" == 'complete' ]]; then
              printf '%s\n' "$body" > uk-source-discovery-result.json
              jq -e '.result.output.country == "UK" and .result.output.mode == "uk_source_discovery_pr" and .result.output.source_removals == 0 and .result.output.opportunity_pr_attempted == false and .result.output.production_opportunity_write_attempted == false and .result.output.direct_production_deployment_attempted == false and .result.output.automatic_merge_attempted == false' <<<"$body" >/dev/null
              echo '### UK Cloudflare source discovery proof' >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              jq '.result.output' <<<"$body" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              completed=true
              break
            fi
            if [[ "$status" == 'errored' || "$status" == 'terminated' ]]; then
              printf '%s\n' "$body" > uk-source-discovery-result.json
              jq '.result.error' <<<"$body" >&2
              exit 1
            fi
            sleep 5
          done
          [[ "$completed" == 'true' ]] || { echo 'UK source discovery proof timed out.' >&2; exit 1; }

      - name: Restore read-only global shadow
        if: always()
        run: npx --yes wrangler@4.127.1 deploy --config "$CONFIG"

      - name: Remove temporary GitHub write token
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"GITHUB_TOKEN":null}' | npx --yes wrangler@4.127.1 secret bulk --config "$CONFIG"

      - name: Publish UK source discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uk-source-discovery-proof-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            uk-source-discovery-pr-only-health.json
            uk-source-discovery-blocked-us.json
            uk-source-discovery-result.json
          if-no-files-found: ignore
          retention-days: 14
