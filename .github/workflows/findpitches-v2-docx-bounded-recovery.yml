name: FindPitches v2 DOCX Bounded Recovery

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - 'operations/findpitches-v2/run-docx-bounded-recovery.mjs'
      - 'platform/findpitches-v2/**'
      - 'tests/findpitches-v2/**'
      - '.github/workflows/findpitches-v2-docx-bounded-recovery.yml'

permissions:
  contents: read

concurrency:
  group: findpitches-v2-docx-bounded-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.pull_request.number == 1872
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: findpitches-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DOCX_BOUNDED_RECOVERY_APPLY: '1'
      DOCX_BOUNDED_RECOVERY_BATCH_ID: '2026-09-30-docx-practical-v1'
      DOCX_BOUNDED_RECOVERY_IDS: 'fpv2_24af3d6278473a6d84331cec'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --no-audit --no-fund

      - name: Run FindPitches v2 tests
        run: node --test tests/findpitches-v2/*.test.mjs

      - name: Prove isolated shadow target
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --silent --show-error --fail-with-body --max-time 15 https://api.findpitches.com/health)"
          jq -e '.ok == true and .database == "isolated" and .mode == "shadow" and .publication_enabled == false' <<< "$health" >/dev/null

      - name: Run one-shot targeted DOCX recovery
        run: node operations/findpitches-v2/run-docx-bounded-recovery.mjs

      - name: Re-audit practical readiness
        run: node operations/findpitches-v2/audit-practical-readiness.mjs | tee practical-readiness-after-docx.json

      - uses: actions/upload-artifact@v4
        with:
          name: docx-bounded-recovery-${{ github.run_id }}
          path: |
            docx-bounded-recovery-result.json
            practical-readiness-after-docx.json
          retention-days: 14
