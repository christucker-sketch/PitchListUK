name: FindPitches v2 GB Ranked Preview

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - 'operations/findpitches-v2/preview-gb-ranked-recovery.mjs'
      - '.github/workflows/findpitches-v2-gb-ranked-preview.yml'

permissions:
  contents: read

concurrency:
  group: findpitches-v2-gb-ranked-preview
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.number == 1872
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: findpitches-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Prove isolated shadow target
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --silent --show-error --fail-with-body --max-time 15 https://api.findpitches.com/health)"
          jq -e '.ok == true and .database == "isolated" and .mode == "shadow" and .publication_enabled == false' <<< "$health" >/dev/null
      - name: Run ranked GB recovery preview
        run: node operations/findpitches-v2/preview-gb-ranked-recovery.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: gb-ranked-preview-${{ github.run_id }}
          path: gb-ranked-recovery-preview.json
          retention-days: 14
