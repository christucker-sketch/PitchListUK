name: US controller one-shot legacy replay recovery

on:
  push:
    branches: [main]
    paths:
      - 'operations/cloudflare-global-acquisition/lib/controller-legacy-replay-recovery.mjs'
      - 'operations/cloudflare-global-acquisition/src/controller-state.js'
      - 'operations/cloudflare-global-acquisition/src/index.js'
      - '.github/workflows/us-controller-legacy-replay-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: findpitches-us-controller-one-shot-legacy-replay-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: findpitches-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: operations/cloudflare-global-acquisition/wrangler.jsonc
      WORKFLOW_NAME: findpitches-global-acquisition-shadow
      EXPECTED_REPLAY_KEY: discover:MI:128:4
    steps:
      - name: Check out exact main recovery commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for exact replay recovery capability under safe execution policy
        shell: bash
        run: |
          set -euo pipefail
          health_url='https://findpitches-global-acquisition-shadow.ctucker.workers.dev/health'
          ready=false
          for attempt in $(seq 1 90); do
            body="$(curl --silent --show-error --fail-with-body "$health_url" || true)"
            if jq -e '
              .ok == true and
              .failed_legacy_mi_replay_recovery == true and
              .execution_enabled == true and
              .execution_level == "read_only" and
              .us_controller_cutover_enabled == false
            ' <<<"$body" >/dev/null 2>&1; then
              printf '%s\n' "$body" > legacy-replay-recovery-health.json
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == 'true' ]] || { echo 'Failed-legacy-replay recovery capability did not become observable under safe policy.' >&2; exit 1; }

      - name: Execute exact failed legacy replay recovery
        shell: bash
        run: |
          set -euo pipefail
          instance_id="us-controller-legacy-replay-recovery-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          params='{"country":"US","mode":"recover_failed_legacy_mi_replay"}'
          npx --yes wrangler@4.127.1 workflows trigger "$WORKFLOW_NAME" "$params" --id "$instance_id" --config "$CONFIG"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances/${instance_id}"
          completed=false
          for attempt in $(seq 1 90); do
            body="$(curl --silent --show-error --fail-with-body "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" || true)"
            status="$(jq -r '.result.status // empty' <<<"$body" 2>/dev/null || true)"
            if [[ "$status" == 'complete' ]]; then
              printf '%s\n' "$body" > legacy-replay-recovery-result.json
              jq -e --arg replay "$EXPECTED_REPLAY_KEY" '
                .result.output.country == "US" and
                .result.output.mode == "recover_failed_legacy_mi_replay" and
                .result.output.ok == true and
                .result.output.recovered == true and
                .result.output.authority == "shadow" and
                .result.output.state_source == "cloudflare-us-controller-legacy-recovery" and
                .result.output.state_status == "ready" and
                .result.output.deferred_replay_inflight == false and
                .result.output.replay_key == $replay and
                (.result.output.state_version | type == "number") and
                .result.output.state_version >= 13 and
                (.result.output.state_sha256 | type == "string")
              ' <<<"$body" >/dev/null
              echo '### US controller failed legacy replay recovery' >> "$GITHUB_STEP_SUMMARY"
              echo '```json' >> "$GITHUB_STEP_SUMMARY"
              jq '.result.output' <<<"$body" >> "$GITHUB_STEP_SUMMARY"
              echo '```' >> "$GITHUB_STEP_SUMMARY"
              completed=true
              break
            fi
            if [[ "$status" == 'errored' || "$status" == 'terminated' ]]; then
              printf '%s\n' "$body" > legacy-replay-recovery-result.json
              jq '.result.error' <<<"$body" >&2
              exit 1
            fi
            sleep 2
          done
          [[ "$completed" == 'true' ]] || { echo 'Failed legacy replay recovery timed out.' >&2; exit 1; }

      - name: Publish legacy replay recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-controller-legacy-replay-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            legacy-replay-recovery-health.json
            legacy-replay-recovery-result.json
          if-no-files-found: warn
          retention-days: 30
