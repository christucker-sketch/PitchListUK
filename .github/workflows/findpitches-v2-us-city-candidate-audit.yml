name: FindPitches v2 US city candidate refresh audit

"on":
  push:
    branches:
      - findpitches-v2/venue-evidence-recovery
    paths:
      - .github/workflows/findpitches-v2-us-city-candidate-audit.yml
  workflow_dispatch:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: findpitches-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove isolated fail-closed v2
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --silent --show-error --fail-with-body --max-time 15 https://api.findpitches.com/health)"
          jq -e '.ok == true and .database == "isolated" and .mode == "shadow" and .publication_enabled == false' <<< "$health" >/dev/null
      - name: Audit US city-job candidate enrichment coverage
        run: node operations/findpitches-v2/audit-us-city-candidate-refresh.mjs
