name: FindPitches v2 GB Bounded Recovery

on:
  pull_request:
    types: [ready_for_review]
    paths:
      - 'platform/findpitches-v2/**'
      - 'operations/findpitches-v2/**'
      - 'tests/findpitches-v2/**'
      - '.github/workflows/findpitches-v2-gb-bounded-recovery.yml'

permissions:
  contents: read

concurrency:
  group: findpitches-v2-gb-bounded-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.pull_request.number == 1872
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: findpitches-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      GB_BOUNDED_RECOVERY_APPLY: '1'
      GB_BOUNDED_RECOVERY_LIMIT: '1'
      GB_BOUNDED_RECOVERY_BATCH_ID: '2026-09-30-gb-practical-v10'
      GB_BOUNDED_RECOVERY_IDS: 'fpv2_c7a87e37c19d56297a8d16b3'

    steps:
      - name: Check out candidate
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run FindPitches v2 tests
        run: node --test tests/findpitches-v2/*.test.mjs

      - name: Prove target remains isolated and publication-off
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --silent --show-error --fail-with-body --max-time 15 https://api.findpitches.com/health)"
          jq -e '.ok == true and .database == "isolated" and .mode == "shadow" and .publication_enabled == false' <<< "$health" >/dev/null

      - name: Run one-shot bounded GB recovery
        run: node operations/findpitches-v2/run-gb-bounded-recovery.mjs

      - name: Re-audit practical readiness
        run: node operations/findpitches-v2/audit-practical-readiness.mjs | tee practical-readiness-after-gb-bounded.json

      - name: Upload bounded recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: gb-bounded-recovery-${{ github.run_id }}
          path: |
            gb-bounded-recovery-result.json
            practical-readiness-after-gb-bounded.json
          retention-days: 14
