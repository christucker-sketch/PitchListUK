name: UK source registry handoff

on:
  push:
    branches: [main]
    paths:
      - 'operations/opportunity-pipeline/config/approved-source-routes.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: findpitches-uk-source-registry-handoff
  cancel-in-progress: false

jobs:
  verify_handoff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: findpitches-production
    steps:
      - name: Check out verified main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run UK controller handoff safety tests
        run: node --test tests/uk-cloudflare-source-discovery.test.mjs tests/uk-approved-source-poll-publication.test.mjs tests/uk-cloud-controller.test.mjs tests/uk-controller-github-client.test.mjs

      - name: Verify authoritative global controller remains production
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://findpitches-global-acquisition-shadow.ctucker.workers.dev/health'
          for attempt in $(seq 1 30); do
            if body="$(curl --silent --show-error --fail-with-body "$endpoint")" && \
              jq -e '.ok == true and
                     .execution_enabled == true and
                     .execution_level == "production" and
                     .us_controller_cutover_enabled == true and
                     .uk_controller_cutover_enabled == true and
                     .ca_controller_cutover_enabled == true and
                     .controller_state_store == true and
                     .uk_controller_state_store == true and
                     .ca_controller_state_store == true' <<<"$body" >/dev/null; then
              echo 'Authoritative global controller is healthy; autonomous controller owns post-merge acquisition.'
              exit 0
            fi
            sleep 2
          done
          echo 'Authoritative production controller health did not converge.' >&2
          exit 1
