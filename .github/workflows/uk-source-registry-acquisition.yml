name: UK source registry acquisition

on:
  push:
    branches: [main]
    paths:
      - 'operations/opportunity-pipeline/config/approved-source-routes.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: findpitches-global-acquisition-shadow-proof
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: findpitches-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: operations/cloudflare-global-acquisition/wrangler.jsonc
      WORKFLOW_NAME: findpitches-global-acquisition-shadow
      EPHEMERAL_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Check out verified main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run UK publication regression tests
        run: node --test tests/uk-addition-publication.test.mjs tests/uk-approved-source-poll-publication.test.mjs tests/global-cloudflare-acquisition-controller.test.mjs

      - name: Compile global acquisition Worker
        run: npx --yes wrangler@4.127.1 deploy --dry-run --config "$CONFIG"

      - name: Deploy read-only global acquisition Worker
        run: npx --yes wrangler@4.127.1 deploy --config "$CONFIG"

      - name: Prove US production acquisition is blocked read-only
        shell: bash
        run: |
          set -euo pipefail
          instance_id="uk-source-merge-readonly-us-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          params='{"country":"US","state_code":"NY","mode":"acquire"}'
          npx --yes wrangler@4.127.1 workflows trigger "$WORKFLOW_NAME" "$params" --id "$instance_id" --config "$CONFIG"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances/${instance_id}?simple=true"
          for attempt in $(seq 1 60); do
            body="$(curl --silent --show-error --fail-with-body "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
            status="$(jq -r '.result.status // empty' <<<"$body")"
            if [[ "$status" == 'errored' ]]; then
              message="$(jq -r '.result.error.message // empty' <<<"$body")"
              [[ "$message" == *'Global acquisition controller is read-only'* ]] || { echo "Unexpected safety error: $message" >&2; exit 1; }
              exit 0
            fi
            [[ "$status" != 'complete' && "$status" != 'terminated' ]] || { echo "US mutation probe unexpectedly reached $status" >&2; exit 1; }
            sleep 2
          done
          echo 'Read-only US mutation proof timed out.' >&2
          exit 1

      - name: Run full UK read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          instance_id="uk-source-merge-readonly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          as_of="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          params="$(jq -cn --arg as_of "$as_of" '{country:"UK",mode:"approved_source_cloudflare_read_only_poll",as_of:$as_of,batch_size:8,concurrency:3,timeout_ms:12000,max_attempts:1}')"
          npx --yes wrangler@4.127.1 workflows trigger "$WORKFLOW_NAME" "$params" --id "$instance_id" --config "$CONFIG"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances/${instance_id}"
          for attempt in $(seq 1 300); do
            body="$(curl --silent --show-error --fail-with-body "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
            status="$(jq -r '.result.status // empty' <<<"$body")"
            if [[ "$status" == 'complete' ]]; then
              printf '%s\n' "$body" > uk-source-registry-readonly.json
              jq -e '.result.output.country == "UK" and .result.output.publication_attempted == false and .result.output.mutation_attempted == false' <<<"$body" >/dev/null
              exit 0
            fi
            if [[ "$status" == 'errored' || "$status" == 'terminated' ]]; then jq '.result.error' <<<"$body" >&2; exit 1; fi
            sleep 5
          done
          echo 'UK read-only preflight timed out.' >&2
          exit 1

      - name: Provision temporary GitHub branch-write token
        run: printf '%s' "$EPHEMERAL_GITHUB_TOKEN" | npx --yes wrangler@4.127.1 secret put GITHUB_TOKEN --config "$CONFIG"

      - name: Deploy PR-only global acquisition Worker
        run: >-
          npx --yes wrangler@4.127.1 deploy --config "$CONFIG"
          --var GLOBAL_ACQUISITION_EXECUTION_ENABLED:true
          --var GLOBAL_ACQUISITION_EXECUTION_LEVEL:pr_only
          --var GITHUB_REPO:christucker-sketch/PitchListUK

      - name: Prove US production acquisition is blocked PR-only
        shell: bash
        run: |
          set -euo pipefail
          instance_id="uk-source-merge-pronly-us-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          params='{"country":"US","state_code":"NY","mode":"acquire"}'
          npx --yes wrangler@4.127.1 workflows trigger "$WORKFLOW_NAME" "$params" --id "$instance_id" --config "$CONFIG"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances/${instance_id}?simple=true"
          for attempt in $(seq 1 60); do
            body="$(curl --silent --show-error --fail-with-body "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
            status="$(jq -r '.result.status // empty' <<<"$body")"
            if [[ "$status" == 'errored' ]]; then
              message="$(jq -r '.result.error.message // empty' <<<"$body")"
              [[ "$message" == *'Global acquisition controller is PR-only'* ]] || { echo "Unexpected safety error: $message" >&2; exit 1; }
              exit 0
            fi
            [[ "$status" != 'complete' && "$status" != 'terminated' ]] || { echo "US mutation probe unexpectedly reached $status" >&2; exit 1; }
            sleep 2
          done
          echo 'PR-only US mutation proof timed out.' >&2
          exit 1

      - name: Run UK additions-only acquisition
        shell: bash
        run: |
          set -euo pipefail
          instance_id="uk-source-merge-additions-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          as_of="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          params="$(jq -cn --arg as_of "$as_of" '{country:"UK",mode:"uk_additions_only_pr",as_of:$as_of,batch_size:8,concurrency:3,timeout_ms:12000,max_attempts:1,max_additions:50,max_growth_percent:25,max_per_source:1,max_duplicate_rate:60}')"
          npx --yes wrangler@4.127.1 workflows trigger "$WORKFLOW_NAME" "$params" --id "$instance_id" --config "$CONFIG"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances/${instance_id}"
          for attempt in $(seq 1 360); do
            body="$(curl --silent --show-error --fail-with-body "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
            status="$(jq -r '.result.status // empty' <<<"$body")"
            if [[ "$status" == 'complete' ]]; then
              printf '%s\n' "$body" > uk-source-registry-additions.json
              jq -e '.result.output.country == "UK" and .result.output.mode == "uk_additions_only_pr" and .result.output.publication_attempted == false and .result.output.production_mutation_attempted == false and .result.output.automatic_merge_attempted == false' <<<"$body" >/dev/null
              jq '.result.output' <<<"$body" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$status" == 'errored' || "$status" == 'terminated' ]]; then printf '%s\n' "$body" > uk-source-registry-additions.json; jq '.result.error' <<<"$body" >&2; exit 1; fi
            sleep 5
          done
          echo 'UK additions acquisition timed out.' >&2
          exit 1

      - name: Restore read-only global acquisition Worker
        if: always()
        run: npx --yes wrangler@4.127.1 deploy --config "$CONFIG"

      - name: Remove temporary GitHub token
        if: always()
        run: printf '%s' '{"GITHUB_TOKEN":null}' | npx --yes wrangler@4.127.1 secret bulk --config "$CONFIG"

      - name: Upload UK source-merge acquisition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uk-source-registry-acquisition-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            uk-source-registry-readonly.json
            uk-source-registry-additions.json
          if-no-files-found: ignore
          retention-days: 14
