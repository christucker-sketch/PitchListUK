name: FindPitches v2 original UK practical benchmark

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Benchmark original reviewed UK catalogue
        run: node operations/findpitches-v2/benchmark-old-uk-catalogue.mjs
