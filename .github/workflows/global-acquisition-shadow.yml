name: Global acquisition shadow proof

on:
  pull_request:
    paths:
      - 'operations/cloudflare-global-acquisition/**'
      - 'operations/cloudflare-uk-canary/lib/uk-approved-source-poll.mjs'
      - 'operations/cloudflare-texas-acquisition/src/entrypoint.js'
      - 'operations/cloudflare-texas-acquisition/src/internal-serper-broker.js'
      - 'operations/cloudflare-texas-acquisition/wrangler.jsonc'
      - 'operations/opportunity-pipeline/lib/uk-addition-publication.js'
      - 'platform/acquisition/**'
      - 'platform/countries.mjs'
      - 'scripts/build-automatic-addition-manifest.js'
      - 'tests/global-cloudflare-acquisition-controller.test.mjs'
      - 'tests/global-acquisition-engine.test.mjs'
      - 'tests/internal-serper-service-binding.test.mjs'
      - 'tests/uk-cloudflare-source-discovery.test.mjs'
      - 'tests/uk-addition-publication.test.mjs'
      - 'tests/uk-approved-source-poll-publication.test.mjs'
      - 'tests/ca-controller-cutover-readiness.test.mjs'
      - 'tests/ca-shadow-readiness-dispatch.test.mjs'
      - '.github/workflows/global-acquisition-shadow.yml'
      - '.github/workflows/uk-source-discovery-live-proof.yml'
  push:
    branches: [main]
    paths:
      - 'operations/cloudflare-global-acquisition/**'
      - 'operations/cloudflare-uk-canary/lib/uk-approved-source-poll.mjs'
      - 'operations/cloudflare-texas-acquisition/src/entrypoint.js'
      - 'operations/cloudflare-texas-acquisition/src/internal-serper-broker.js'
      - 'operations/cloudflare-texas-acquisition/wrangler.jsonc'
      - 'operations/opportunity-pipeline/lib/uk-addition-publication.js'
      - 'platform/acquisition/**'
      - 'platform/countries.mjs'
      - 'scripts/build-automatic-addition-manifest.js'
      - 'tests/global-cloudflare-acquisition-controller.test.mjs'
      - 'tests/global-acquisition-engine.test.mjs'
      - 'tests/internal-serper-service-binding.test.mjs'
      - 'tests/uk-cloudflare-source-discovery.test.mjs'
      - 'tests/uk-addition-publication.test.mjs'
      - 'tests/uk-approved-source-poll-publication.test.mjs'
      - 'tests/ca-controller-cutover-readiness.test.mjs'
      - 'tests/ca-shadow-readiness-dispatch.test.mjs'
      - '.github/workflows/global-acquisition-shadow.yml'
      - '.github/workflows/uk-source-discovery-live-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: findpitches-global-acquisition-shadow-proof
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run global acquisition controller tests
        run: node --test tests/global-acquisition-engine.test.mjs tests/global-cloudflare-acquisition-controller.test.mjs tests/country-acquisition-contract.test.mjs tests/internal-serper-service-binding.test.mjs tests/uk-cloudflare-source-discovery.test.mjs tests/uk-addition-publication.test.mjs tests/uk-approved-source-poll-publication.test.mjs tests/ca-controller-cutover-readiness.test.mjs tests/ca-shadow-readiness-dispatch.test.mjs

      - name: Compile global Cloudflare acquisition shadow
        run: npx --yes wrangler@4.127.1 deploy --dry-run --config operations/cloudflare-global-acquisition/wrangler.jsonc

  deploy_and_prove:
    if: github.event_name != 'pull_request'
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: findpitches-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: operations/cloudflare-global-acquisition/wrangler.jsonc
      WORKFLOW_NAME: findpitches-global-acquisition-shadow
    steps:
      - name: Check out verified main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy configured production policy
        run: npx --yes wrangler@4.127.1 deploy --config "$CONFIG"

      - name: Verify authoritative production health
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://findpitches-global-acquisition-shadow.ctucker.workers.dev/health'
          healthy=false
          for attempt in $(seq 1 30); do
            body="$(curl --silent --show-error --fail-with-body "$endpoint")"
            if jq -e '.ok == true and .execution_enabled == true and .execution_level == "production" and .us_controller_cutover_enabled == true and .uk_controller_cutover_enabled == true and .ca_controller_cutover_enabled == true and .controller_state_store == true and .uk_controller_state_store == true and .ca_controller_state_store == true' <<<"$body" >/dev/null; then
              printf '%s\n' "$body" > global-production-health.json
              healthy=true
              break
            fi
            sleep 2
          done
          [[ "$healthy" == "true" ]] || { echo 'Configured production health did not propagate.' >&2; exit 1; }

      - name: Verify global Workflow is describable
        run: npx --yes wrangler@4.127.1 workflows describe "$WORKFLOW_NAME" --config "$CONFIG"

      - name: Run bounded US read-only parity poll under production policy
        shell: bash
        run: |
          set -euo pipefail
          instance_id="global-us-readonly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          as_of="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          params="$(jq -cn --arg as_of "$as_of" '{country:"US",mode:"approved_source_cloudflare_read_only_poll",state_code:"NY",source_limit:2,timeout_ms:12000,as_of:$as_of}')"
          npx --yes wrangler@4.127.1 workflows trigger "$WORKFLOW_NAME" "$params" --id "$instance_id" --config "$CONFIG"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances/${instance_id}"
          completed=false
          for attempt in $(seq 1 120); do
            body="$(curl --silent --show-error --fail-with-body "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
            status="$(jq -r '.result.status // empty' <<<"$body")"
            if [[ "$status" == "complete" ]]; then
              printf '%s\n' "$body" > global-us-readonly-result.json
              jq -e '.result.output.country == "US" and .result.output.mode == "approved_source_cloudflare_read_only_poll" and .result.output.publication_attempted == false and .result.output.mutation_attempted == false' <<<"$body" >/dev/null
              completed=true
              break
            fi
            [[ "$status" != "errored" && "$status" != "terminated" ]] || { jq '.result.error' <<<"$body" >&2; exit 1; }
            sleep 5
          done
          [[ "$completed" == "true" ]] || { echo 'US global read-only poll timed out.' >&2; exit 1; }

      - name: Run full UK read-only parity poll under production policy
        shell: bash
        run: |
          set -euo pipefail
          instance_id="global-uk-readonly-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          as_of="$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')"
          params="$(jq -cn --arg as_of "$as_of" '{country:"UK",mode:"approved_source_cloudflare_read_only_poll",as_of:$as_of,batch_size:8,concurrency:3,timeout_ms:12000,max_attempts:1}')"
          npx --yes wrangler@4.127.1 workflows trigger "$WORKFLOW_NAME" "$params" --id "$instance_id" --config "$CONFIG"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances/${instance_id}"
          completed=false
          for attempt in $(seq 1 300); do
            body="$(curl --silent --show-error --fail-with-body "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
            status="$(jq -r '.result.status // empty' <<<"$body")"
            if [[ "$status" == "complete" ]]; then
              printf '%s\n' "$body" > global-uk-readonly-result.json
              jq -e '.result.output.country == "UK" and .result.output.mode == "approved_source_cloudflare_read_only_poll" and .result.output.publication_attempted == false and .result.output.mutation_attempted == false' <<<"$body" >/dev/null
              completed=true
              break
            fi
            [[ "$status" != "errored" && "$status" != "terminated" ]] || { jq '.result.error' <<<"$body" >&2; exit 1; }
            sleep 5
          done
          [[ "$completed" == "true" ]] || { echo 'UK global read-only poll timed out.' >&2; exit 1; }

      - name: Read authoritative UK controller state
        shell: bash
        run: |
          set -euo pipefail
          instance_id="global-uk-controller-readiness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npx --yes wrangler@4.127.1 workflows trigger "$WORKFLOW_NAME" '{"country":"UK","mode":"controller_cutover_readiness"}' --id "$instance_id" --config "$CONFIG" >/dev/null
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances/${instance_id}"
          for attempt in $(seq 1 60); do
            body="$(curl --silent --show-error --fail-with-body "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
            status="$(jq -r '.result.status // empty' <<<"$body")"
            if [[ "$status" == 'complete' ]]; then
              jq -e '
                .result.output.country == "UK" and
                .result.output.mode == "controller_cutover_readiness" and
                .result.output.mutation_attempted == false and
                .result.output.available == true and
                .result.output.cutover_enabled == true and
                .result.output.authority == "authoritative" and
                (.result.output.state_version | numbers) and
                (.result.output.state_version > 0)
              ' <<<"$body" >/dev/null
              printf '%s\n' "$body" > global-uk-controller-readiness.json
              jq '.result.output' <<<"$body" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$status" == 'errored' || "$status" == 'terminated' ]]; then jq '.result.error' <<<"$body" >&2; exit 1; fi
            sleep 2
          done
          echo 'UK controller readiness workflow timed out.' >&2
          exit 1

      - name: Prove Canada authoritative controller has entered live acquisition
        shell: bash
        run: |
          set -euo pipefail

          read_readiness() {
            local id="$1"
            local endpoint body status
            npx --yes wrangler@4.127.1 workflows trigger "$WORKFLOW_NAME" '{"country":"CA","mode":"controller_cutover_readiness"}' --id "$id" --config "$CONFIG" >/dev/null
            endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances/${id}"
            for poll in $(seq 1 60); do
              body="$(curl --silent --show-error --fail-with-body "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
              status="$(jq -r '.result.status // empty' <<<"$body")"
              if [[ "$status" == 'complete' ]]; then
                printf '%s\n' "$body"
                return 0
              fi
              [[ "$status" != 'errored' && "$status" != 'terminated' ]] || { jq '.result.error' <<<"$body" >&2; return 1; }
              sleep 2
            done
            echo 'Canada readiness workflow timed out.' >&2
            return 1
          }

          baseline_body="$(read_readiness "global-ca-live-baseline-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}")"
          baseline_output="$(jq -c '.result.output' <<<"$baseline_body")"
          jq -e '
            .country == "CA" and
            .mode == "controller_cutover_readiness" and
            .mutation_attempted == false and
            .authority == "authoritative" and
            .cutover_enabled == true and
            .controller_kind == "ca" and
            .plan_size == .expected_plan_size and
            (.state_version | numbers) and
            (.state_version > 0) and
            (.state_status != "blocked")
          ' <<<"$baseline_output" >/dev/null
          baseline_version="$(jq -r '.state_version' <<<"$baseline_output")"

          if jq -e '.clean_checkpoint == false or .state_status != "ready_discovery" or .current_source_count > 0 or .current_production_count > 0' <<<"$baseline_output" >/dev/null; then
            printf '%s\n' "$baseline_body" > global-ca-live-result.json
            exit 0
          fi

          engaged=false
          for attempt in $(seq 1 60); do
            body="$(read_readiness "global-ca-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}")"
            output="$(jq -c '.result.output' <<<"$body")"
            jq -e '
              .country == "CA" and
              .mode == "controller_cutover_readiness" and
              .mutation_attempted == false and
              .authority == "authoritative" and
              .cutover_enabled == true and
              .controller_kind == "ca" and
              .plan_size == .expected_plan_size and
              (.state_status != "blocked")
            ' <<<"$output" >/dev/null
            current_version="$(jq -r '.state_version' <<<"$output")"
            if [[ "$current_version" -gt "$baseline_version" ]] || jq -e '.clean_checkpoint == false or .state_status != "ready_discovery" or .current_source_count > 0 or .current_production_count > 0' <<<"$output" >/dev/null; then
              printf '%s\n' "$body" > global-ca-live-result.json
              engaged=true
              break
            fi
            sleep 5
          done
          [[ "$engaged" == 'true' ]] || { echo 'Canada cutover is enabled but the autonomous controller did not advance.' >&2; exit 1; }

      - name: Publish global parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-acquisition-shadow-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            global-production-health.json
            global-us-readonly-result.json
            global-uk-readonly-result.json
            global-uk-controller-readiness.json
            global-ca-live-result.json
          if-no-files-found: ignore
          retention-days: 14
