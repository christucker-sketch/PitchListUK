name: Canada controller authority promotion

on:
  push:
    branches: [main]
    paths:
      - 'operations/cloudflare-global-acquisition/lib/ca-controller-cutover-operator.mjs'
      - '.github/workflows/ca-controller-authority-promotion.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: findpitches-ca-controller-authority-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: findpitches-production
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: operations/cloudflare-global-acquisition/wrangler.jsonc
      WORKFLOW_NAME: findpitches-global-acquisition-shadow
      HEALTH_URL: https://findpitches-global-acquisition-shadow.ctucker.workers.dev/health
      CONFIRMATION: PROMOTE_CA_SHADOW_AUTHORITY_WITH_CUTOVER_DISABLED
    steps:
      - name: Check out exact main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for exact-main global shadow proof
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            echo 'Manual dispatch: exact current readiness will still be re-proven below.'
            exit 0
          fi
          ready=false
          for attempt in $(seq 1 180); do
            json="$(gh run list --workflow 'Global acquisition shadow proof' --commit "$GITHUB_SHA" --event push --json databaseId,status,conclusion --limit 10)"
            if jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' <<<"$json" >/dev/null; then
              ready=true
              break
            fi
            if jq -e 'any(.[]; .status == "completed" and (.conclusion != "success" and .conclusion != "skipped"))' <<<"$json" >/dev/null; then
              echo 'Exact-main global shadow proof failed; Canada authority will not be promoted.' >&2
              exit 1
            fi
            sleep 5
          done
          [[ "$ready" == 'true' ]] || { echo 'Timed out waiting for exact-main global shadow proof.' >&2; exit 1; }

      - name: Verify promotion operator is deployed with Canada cutover off
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 90); do
            body="$(curl --silent --show-error --fail-with-body "$HEALTH_URL" || true)"
            if jq -e '.ok == true and .execution_enabled == true and .execution_level == "production" and .ca_controller_cutover_enabled == false and .ca_controller_state_store == true and .manual_ca_authority_promotion_operator == true' <<<"$body" >/dev/null 2>&1; then
              printf '%s\n' "$body" > ca-authority-health.json
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == 'true' ]] || { echo 'Canada authority promotion operator is not observable under safe production policy.' >&2; exit 1; }

      - name: Read exact live Canada readiness
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          instance_id="ca-authority-readiness-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          params='{"country":"CA","mode":"controller_cutover_readiness"}'
          npx --yes wrangler@4.127.1 workflows trigger "$WORKFLOW_NAME" "$params" --id "$instance_id" --config "$CONFIG"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances/${instance_id}"
          completed=false
          for attempt in $(seq 1 120); do
            body="$(curl --silent --show-error --fail-with-body "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
            status="$(jq -r '.result.status // empty' <<<"$body")"
            if [[ "$status" == 'complete' ]]; then
              printf '%s\n' "$body" > ca-authority-readiness.json
              output="$(jq -c '.result.output' <<<"$body")"
              authority="$(jq -r '.authority' <<<"$output")"
              jq -e --arg sha "$GITHUB_SHA" '.country == "CA" and .mode == "controller_cutover_readiness" and .mutation_attempted == false and .cutover_enabled == false and .clean_checkpoint == true and .production_count_matches == true and .source_count_matches == true and .current_main_sha == $sha' <<<"$output" >/dev/null
              if [[ "$authority" == 'authoritative' ]]; then
                jq -e '.launch_ready == true' <<<"$output" >/dev/null
                echo 'already_authoritative=true' >> "$GITHUB_OUTPUT"
              elif [[ "$authority" == 'shadow' ]]; then
                jq -e '.promotion_ready == true and .launch_ready == false' <<<"$output" >/dev/null
                echo 'already_authoritative=false' >> "$GITHUB_OUTPUT"
                echo "state_version=$(jq -r '.state_version' <<<"$output")" >> "$GITHUB_OUTPUT"
                echo "state_sha256=$(jq -r '.state_sha256' <<<"$output")" >> "$GITHUB_OUTPUT"
              else
                echo "Unexpected Canada authority: $authority" >&2
                exit 1
              fi
              completed=true
              break
            fi
            [[ "$status" != 'errored' && "$status" != 'terminated' ]] || { jq '.result.error' <<<"$body" >&2; exit 1; }
            sleep 2
          done
          [[ "$completed" == 'true' ]] || { echo 'Canada readiness proof timed out.' >&2; exit 1; }

      - name: Promote exact Canada shadow authority
        if: steps.readiness.outputs.already_authoritative == 'false'
        shell: bash
        env:
          STATE_VERSION: ${{ steps.readiness.outputs.state_version }}
          STATE_SHA256: ${{ steps.readiness.outputs.state_sha256 }}
        run: |
          set -euo pipefail
          instance_id="ca-authority-promote-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          params="$(jq -cn \
            --arg mode 'operator_promote_ca_shadow_authority' \
            --arg confirmation "$CONFIRMATION" \
            --arg main "$GITHUB_SHA" \
            --arg sha "$STATE_SHA256" \
            --argjson version "$STATE_VERSION" \
            '{country:"CA",mode:$mode,confirmation:$confirmation,expected_main_sha:$main,expected_version:$version,expected_sha256:$sha}')"
          npx --yes wrangler@4.127.1 workflows trigger "$WORKFLOW_NAME" "$params" --id "$instance_id" --config "$CONFIG"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances/${instance_id}"
          completed=false
          for attempt in $(seq 1 120); do
            body="$(curl --silent --show-error --fail-with-body "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
            status="$(jq -r '.result.status // empty' <<<"$body")"
            if [[ "$status" == 'complete' ]]; then
              printf '%s\n' "$body" > ca-authority-promotion.json
              jq -e --arg sha "$GITHUB_SHA" '
                .result.output.ok == true and
                .result.output.mode == "operator_promote_ca_shadow_authority" and
                .result.output.authority == "authoritative" and
                .result.output.cutover_enabled == false and
                .result.output.current_main_sha == $sha and
                .result.output.clean_checkpoint == true and
                .result.output.production_count_matches == true and
                .result.output.source_count_matches == true and
                .result.output.launch_ready == true and
                .result.output.authority_metadata_mutation_attempted == true and
                .result.output.opportunity_data_mutation_attempted == false and
                .result.output.acquisition_started == false
              ' <<<"$body" >/dev/null
              completed=true
              break
            fi
            if [[ "$status" == 'errored' || "$status" == 'terminated' ]]; then
              printf '%s\n' "$body" > ca-authority-promotion.json
              jq '.result.error' <<<"$body" >&2
              exit 1
            fi
            sleep 2
          done
          [[ "$completed" == 'true' ]] || { echo 'Canada authority promotion timed out.' >&2; exit 1; }

      - name: Independently prove post-promotion state
        shell: bash
        run: |
          set -euo pipefail
          instance_id="ca-authority-postcheck-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          params='{"country":"CA","mode":"controller_cutover_readiness"}'
          npx --yes wrangler@4.127.1 workflows trigger "$WORKFLOW_NAME" "$params" --id "$instance_id" --config "$CONFIG"
          endpoint="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workflows/${WORKFLOW_NAME}/instances/${instance_id}"
          completed=false
          for attempt in $(seq 1 120); do
            body="$(curl --silent --show-error --fail-with-body "$endpoint" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
            status="$(jq -r '.result.status // empty' <<<"$body")"
            if [[ "$status" == 'complete' ]]; then
              printf '%s\n' "$body" > ca-authority-postcheck.json
              jq -e --arg sha "$GITHUB_SHA" '.result.output.country == "CA" and .result.output.authority == "authoritative" and .result.output.cutover_enabled == false and .result.output.clean_checkpoint == true and .result.output.production_count_matches == true and .result.output.source_count_matches == true and .result.output.launch_ready == true and .result.output.current_main_sha == $sha and .result.output.mutation_attempted == false' <<<"$body" >/dev/null
              completed=true
              break
            fi
            [[ "$status" != 'errored' && "$status" != 'terminated' ]] || { jq '.result.error' <<<"$body" >&2; exit 1; }
            sleep 2
          done
          [[ "$completed" == 'true' ]] || { echo 'Canada post-promotion proof timed out.' >&2; exit 1; }

      - name: Publish Canada authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ca-controller-authority-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ca-authority-health.json
            ca-authority-readiness.json
            ca-authority-promotion.json
            ca-authority-postcheck.json
          if-no-files-found: warn
          retention-days: 90
