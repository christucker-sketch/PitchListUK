name: FindPitches v2 Shadow Deploy

on:
  push:
    branches: [main]
    paths:
      - 'platform/findpitches-v2/**'
      - 'operations/findpitches-v2/**'
      - 'tests/findpitches-v2/**'
      - '.github/workflows/findpitches-v2-shadow-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: findpitches-v2-shadow-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy_shadow
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: findpitches-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: operations/findpitches-v2/wrangler.jsonc

    steps:
      - name: Check out verified main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run FindPitches v2 tests
        run: node --test tests/findpitches-v2/*.test.mjs

      - name: Compile isolated shadow Worker
        run: npx --yes wrangler@4.127.1 deploy --dry-run --config "$CONFIG"

      - name: Deploy isolated shadow Worker and auto-provision dedicated D1
        run: npx --yes wrangler@4.127.1 deploy --config "$CONFIG"

      - name: Copy search credential into dedicated v2 Worker secret
        shell: bash
        env:
          V2_SEARCH_KEY: ${{ secrets.FINDPITCHES_SEARCH_API_KEY }}
          MIGRATION_SEARCH_KEY: ${{ secrets.SERPER_API_KEY }}
        run: |
          set -euo pipefail
          key="$V2_SEARCH_KEY"
          if [[ -z "$key" ]]; then
            key="$MIGRATION_SEARCH_KEY"
          fi

          if [[ -n "$key" ]]; then
            printf '%s' "$key" | npx --yes wrangler@4.127.1 secret put FINDPITCHES_SEARCH_API_KEY --config "$CONFIG"
            echo "Dedicated FindPitches v2 search secret configured."
          else
            echo "No GitHub copy of the search key is configured; preserving any existing Cloudflare Worker secret."
          fi

      - name: Apply isolated D1 migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in operations/findpitches-v2/migrations/*.sql; do
            echo "Applying $migration"
            set +e
            output="$(npx --yes wrangler@4.127.1 d1 execute FINDPITCHES_DB --remote --yes --file "$migration" --config "$CONFIG" 2>&1)"
            rc=$?
            set -e
            printf '%s\n' "$output"
            if [[ $rc -ne 0 ]]; then
              if grep -Fq "Not currently importing anything." <<<"$output"; then
                echo "Wrangler reported an empty/idempotent import for $migration; continuing."
              else
                exit "$rc"
              fi
            fi
          done

      - name: Prove isolated cloud runtime
        shell: bash
        run: |
          set -euo pipefail

          passed=false
          for attempt in $(seq 1 15); do
            health="$(curl --silent --show-error --fail-with-body https://api.findpitches.com/health || true)"
            status="$(curl --silent --show-error --fail-with-body https://api.findpitches.com/status || true)"

            if jq -e '
              .ok == true and
              .service == "findpitches-v2-shadow" and
              .mode == "shadow" and
              .database == "isolated" and
              .search_configured == true and
              .publication_enabled == false and
              .legacy_runtime_dependency == false and
              .local_runtime_dependency == false
            ' <<<"$health" >/dev/null 2>&1 && jq -e '
              .ok == true and
              .search_configured == true and
              .publication_enabled == false and
              .counts.scheduler_jobs == 111
            ' <<<"$status" >/dev/null 2>&1; then
              passed=true
              break
            fi

            sleep 2
          done

          if [[ "$passed" != "true" ]]; then
            echo "Final health response:" >&2
            printf '%s\n' "$health" >&2
            echo "Final status response:" >&2
            printf '%s\n' "$status" >&2
            exit 1
          fi


      - name: Show recent validated shadow sample
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body 'https://api.findpitches.com/sample?status=validated&limit=12' | jq .
