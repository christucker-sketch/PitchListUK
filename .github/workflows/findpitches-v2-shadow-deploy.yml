name: FindPitches v2 Shadow Deploy

on:
  push:
    branches: [main]
    paths:
      - 'platform/findpitches-v2/**'
      - 'operations/findpitches-v2/**'
      - 'tests/findpitches-v2/**'
      - '.github/workflows/findpitches-v2-shadow-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: findpitches-v2-shadow-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy_shadow
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: findpitches-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CONFIG: operations/findpitches-v2/wrangler.jsonc

    steps:
      - name: Check out verified main
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run FindPitches v2 tests
        run: node --test tests/findpitches-v2/*.test.mjs

      - name: Compile isolated shadow Worker
        run: npx --yes wrangler@4.127.1 deploy --dry-run --config "$CONFIG"

      - name: Deploy isolated shadow Worker and auto-provision dedicated D1
        run: npx --yes wrangler@4.127.1 deploy --config "$CONFIG"

      - name: Apply isolated D1 schema
        run: |
          npx --yes wrangler@4.127.1 d1 execute FINDPITCHES_DB --remote --yes --file operations/findpitches-v2/migrations/0001_core.sql --config "$CONFIG"
          npx --yes wrangler@4.127.1 d1 execute FINDPITCHES_DB --remote --yes --file operations/findpitches-v2/migrations/0002_seed_shadow_pilots.sql --config "$CONFIG"

      - name: Prove isolated cloud runtime
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --silent --show-error --fail-with-body https://findpitches-v2-shadow.ctucker.workers.dev/health)"
          jq -e '
            .ok == true and
            .service == "findpitches-v2-shadow" and
            .mode == "shadow" and
            .database == "isolated" and
            .publication_enabled == false and
            .legacy_runtime_dependency == false and
            .local_runtime_dependency == false
          ' <<<"$health" >/dev/null

          status="$(curl --silent --show-error --fail-with-body https://findpitches-v2-shadow.ctucker.workers.dev/status)"
          jq -e '.ok == true and .counts.scheduler_jobs >= 3' <<<"$status" >/dev/null
