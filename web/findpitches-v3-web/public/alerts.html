<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alerts | FindPitches</title>

<meta name="robots" content="noindex,follow">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/fp.css">
<style>
.alist{display:grid;gap:14px}
.al{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}
.al .top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:flex-start}
.al h3{font-size:1.08rem;line-height:1.3;margin:0}
.al .meta{color:var(--muted);font-size:.88rem;margin:4px 0 0}
.al .n{font-family:var(--board);font-size:1.4rem;color:var(--ink);font-weight:700}
.al .ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.al .ctl select{height:40px;border:1px solid var(--line);border-radius:9px;padding:0 8px;font:500 .88rem var(--body);background:#fff}
.al .sample{display:grid;gap:6px;margin-top:14px}
.al.paused{background:#FAFBF8}.al.paused h3{color:var(--muted)}
.ed{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ed .full{grid-column:1/-1}
@media (max-width:520px){.ed{grid-template-columns:1fr}}
.examples{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:8px}.examples li{padding:10px 14px;background:var(--chalk);border-radius:10px;font-weight:600}
</style>
</head>
<body data-page="alerts">
<div id="fp-top"></div>
<main id="main">
<section class="phead"><div class="wrap"><h1>Alerts</h1><p>Tell us what you’re looking for. We’ll email you when a newly checked listing matches.</p></div></section>
<div class="wrap section" id="al"><div class="skel"></div></div>
</main>
<div id="fp-foot"></div>
<script src="assets/js/config.js"></script>
<script src="assets/js/routes.js"></script>
<script src="assets/js/v3-api.js"></script>
<script src="assets/js/api.js"></script>

<script src="assets/js/shell.js"></script>
<script src="assets/js/pages/alerts.js"></script>
</body>
</html>
