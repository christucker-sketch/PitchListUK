<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FindPitches</title>
<meta name="description" content="">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/fp.css">
<style>
.lhero{background:var(--chalk);border-bottom:1px solid var(--line)}
.lhero .wrap{padding-block:clamp(26px,4vw,48px)}
.kick{font-size:.86rem;font-weight:600;color:var(--turf-2);margin:0 0 10px}
.lhero h1{font-family:var(--display);font-weight:700;font-size:clamp(1.8rem,4vw,3rem);letter-spacing:-.04em;line-height:1.04;max-width:22ch}
.lhero .intro{margin:14px 0 0;max-width:46em;font-size:1.08rem;color:var(--ink-2)}
.statrow{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:22px}
.statrow div{font-size:.86rem;color:var(--muted);line-height:1.25}
.statrow b{display:block;font-family:var(--board);font-weight:700;font-size:1.8rem;color:var(--ink);line-height:1}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.lgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:clamp(24px,4vw,44px);align-items:start}
.results{display:grid;gap:8px}
.results h2,.lblock h2{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:-.02em;margin:0 0 12px}
.side{display:grid;gap:14px;position:sticky;top:90px}
.side .card h3{font-size:1rem;margin-bottom:8px}
.side ul{margin:0;padding-left:18px;line-height:1.7;font-size:.94rem}
.lblock{margin-top:36px}
.linkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 24px;border-top:1px solid var(--line)}
.linkgrid a{display:flex;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:500}
.linkgrid a small{font-family:var(--board);font-weight:600;font-size:.95rem;color:var(--muted)}
.linkgrid a:hover{color:var(--turf)}
.faq details{border-bottom:1px solid var(--line)}.faq details:first-of-type{border-top:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:16px;padding:16px 0;font-weight:600}
.faq summary::-webkit-details-marker{display:none}.faq summary:after{content:"+";color:var(--turf-2);font-weight:700}
.faq details[open] summary:after{content:"–"}
.faq p{margin:0 0 16px;color:var(--ink-2);max-width:48em}
.ixbadge{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:999px}
.ixbadge.y{background:#DDF1E4;color:var(--ok)}.ixbadge.n{background:#FFE7DF;color:var(--flag-dark)}
/* redirect / 404 */
.sys{max-width:640px;margin:0 auto}
.code301{font-family:var(--board);font-size:3rem;font-weight:700;color:var(--turf)}
/* SEO inspector (draft-only) */
.insp h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px}
.insp h3:first-child{margin-top:0}
.snip{font-family:Arial,sans-serif;border:1px solid var(--line);border-radius:10px;padding:12px}
.snip .u{color:#202124;font-size:.8rem}.snip .t{color:#1a0dab;font-size:1.15rem;line-height:1.3;margin:2px 0}.snip .d{color:#4d5156;font-size:.86rem;line-height:1.45}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:.84rem}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.insp pre{background:var(--chalk);border-radius:8px;padding:10px;font-size:.72rem;overflow:auto;max-height:220px;margin:0}
.checks{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;font-size:.84rem}.checks li.ok b{color:var(--ok)}.checks li.no b{color:var(--flag-dark)}
.len-ok{color:var(--ok)}.len-bad{color:var(--flag-dark)}
@media (max-width:960px){.lgrid{grid-template-columns:1fr}.side{position:static}}
</style>
</head>
<body data-page="seo">
<div id="fp-top"></div>
<main id="page"><div class="wrap section"><div class="skel" style="height:80px;margin-bottom:14px"></div><div class="skel" style="height:300px"></div></div></main>
<div id="fp-foot"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/routes.js"></script>
<script src="assets/js/v3-api.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/seo/seo-config.js"></script>
<script src="assets/js/seo/seo-core.js"></script>
<script src="assets/js/pages/seo.js"></script>
</body>
</html>
